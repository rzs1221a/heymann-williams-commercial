# ferrycre.com — Netlify configuration. This repo is the site root: point a
# Netlify site at it (branch: main) and this file governs the build.

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The map is intentionally client-rendered, so it alone receives a successful
# SPA fallback. Prerendered files and functions are matched before redirects.
[[redirects]]
  from = "/explore"
  to = "/index.html"
  status = 200

# Unknown URLs must be real 404s. Returning index.html with a 200 lets stale
# or mistyped URLs become crawlable duplicate pages.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404

[[headers]]
for = "/*"
  [headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Fingerprinted build output — safe to cache forever.
[[headers]]
for = "/assets/*"
  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"
